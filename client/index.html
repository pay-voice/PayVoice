<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview — PayVoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>

<body>
  <div class="app-shell">
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Navigation Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <a href="#overview" class="brand-mark">
          <div class="brand-icon" aria-hidden="true">PV</div>
          <div class="brand-text">
            <span class="brand-name">PayVoice</span>
            <span class="brand-sub">India OPGSP Exporter</span>
          </div>
        </a>
        <button type="button" id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close navigation menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div>
          <div class="nav-group-label">Workspace</div>
          <div class="nav-list">
            <button type="button" class="nav-item active" data-route="overview">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" />
              </svg>
              <span>Overview</span>
            </button>
            <button type="button" class="nav-item" data-route="voice">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" x2="12" y1="19" y2="22" />
              </svg>
              <span>Voice Assistant</span>
              <span class="nav-badge">AI</span>
            </button>
          </div>
        </div>

        <div>
          <div class="nav-group-label">Operations</div>
          <div class="nav-list">
            <button type="button" class="nav-item" data-route="invoices">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" x2="8" y1="13" y2="13" />
                <line x1="16" x2="8" y1="17" y2="17" />
              </svg>
              <span>Invoices</span>
            </button>
            <button type="button" class="nav-item" data-route="transactions">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <line x1="12" x2="12" y1="2" y2="22" />
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
              </svg>
              <span>Transactions</span>
            </button>
          </div>
        </div>

        <div>
          <div class="nav-group-label">Intelligence</div>
          <div class="nav-list">
            <button type="button" class="nav-item" data-route="money-guide">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                <polyline points="16 7 22 7 22 13" />
              </svg>
              <span>Money Guide AI</span>
            </button>
            <button type="button" class="nav-item" data-route="statements">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <span>Statements</span>
            </button>
          </div>
        </div>

        <div>
          <div class="nav-group-label">Compliance</div>
          <div class="nav-list">
            <button type="button" class="nav-item" data-route="buyers">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
              <span>Buyers</span>
            </button>
            <button type="button" class="nav-item" data-route="security">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              <span>Security &amp; Audit</span>
            </button>
          </div>
        </div>

        <div>
          <div class="nav-group-label">System</div>
          <div class="nav-list">
            <button type="button" class="nav-item" data-route="settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
              <span>Settings</span>
            </button>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="security-status-pill" id="sidebar-security-pill">
          <span class="status-dot" aria-hidden="true"></span>
          <span>AES-256 &amp; SHA-256 Active</span>
        </div>
        <div class="merchant-mini-card">
          <div class="merchant-avatar" aria-hidden="true">MS</div>
          <div class="merchant-meta">
            <strong>PayVoice Exporter</strong>
            <span>IEC 0319088821 &bull; Rule 96A</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation menu"
            aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <span class="crumb-root">PayVoice</span>
            <span aria-hidden="true">/</span>
            <span class="crumb-current" id="breadcrumb-current">Overview</span>
          </nav>
        </div>

        <div class="topbar-right">
          <div id="env-indicator" class="env-indicator" title="PayPal API Environment">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="env-text-short">Sandbox</span>
            <span class="env-text-full">PayPal Sandbox</span>
          </div>

          <select id="topbar-lang-select" class="lang-pill-select" aria-label="Select active voice language">
            <option value="mr">मराठी (MR)</option>
            <option value="hi">हिंदी (HI)</option>
            <option value="en">English (EN)</option>
          </select>

          <div class="popover-wrap">
            <button type="button" id="notif-toggle-btn" class="topbar-icon-btn" aria-label="Toggle notifications"
              aria-expanded="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span id="notif-dot" class="notif-dot"></span>
            </button>
            <div id="notif-popover" class="popover-panel" role="dialog" aria-label="Notifications">
              <div class="popover-head">
                <span>Notifications</span>
                <button type="button" id="notif-mark-read" class="btn btn-ghost btn-sm" style="min-height:26px;">Mark
                  all read</button>
              </div>
              <div id="notif-list" class="popover-list"></div>
            </div>
          </div>

          <button type="button" id="theme-toggle-btn" class="topbar-icon-btn" aria-label="Toggle light or dark theme"
            title="Toggle theme">
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" aria-hidden="true" style="display:none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </header>

      <main id="page-mount" class="main-content" tabindex="-1">
        <div class="card">
          <div class="skeleton" style="height:28px;width:240px;"></div>
          <div class="skeleton" style="height:120px;width:100%;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Accessible Modal Container -->
  <div id="modal-backdrop" class="modal-backdrop" aria-hidden="true">
    <div id="modal-panel" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Modal Title</h2>
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>

</html>
